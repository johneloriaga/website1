<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple E-Commerce</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>MyskibidiShop</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
       
    </nav>
</header>

<section class="hero">
    <h2>Welcome to skibidi Shop</h2>
    <p> Online Store</p>
</section>

<section class="products">

    <h2>Products</h2>

    <div class="product-container">

        <div class="product">
            <h3>Wireless Headphones</h3>
            <p class="price">$50</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <h3>Smart Watch</h3>
            <p class="price">$80</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <h3>Shoes</h3>
            <p class="price">$40</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <h3>Backpack</h3>
            <p class="price">$35</p>
            <button>Add to Cart</button>
        </div>

    </div>

</section>

<footer>
    <p>© 2026 MyskibidiShop</p>
</footer>

</body>
</html>
